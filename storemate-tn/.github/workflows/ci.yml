name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, type-check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: storemate
          POSTGRES_PASSWORD: storemate
          POSTGRES_DB: storemate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storemate -d storemate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://storemate:storemate@localhost:5432/storemate
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type-check
        run: mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Apply migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Vitest unit tests
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Hostinger VPS
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # "environment: production" is what gates this job on manual approval —
    # configure a required reviewer on the "production" environment under
    # repo Settings → Environments so this pauses for a human click before
    # ever touching the live VPS (a paid, customer-facing app per CLAUDE.md).
    # See docs/DEPLOYMENT.md §CI/CD deploy job for the one-time setup.
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            bash scripts/deploy.sh
