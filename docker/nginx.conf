# Public-facing reverse proxy: TLS termination + routing to the built
# frontend (nginx, static files) and the backend API (gunicorn/uvicorn).
# ${DOMAIN} is substituted by scripts/deploy.sh (envsubst) from the .env's
# DOMAIN value before this file is mounted — see docs/DEPLOYMENT.md.
#
# Bootstrapping note: nginx refuses to start if the ssl_certificate paths
# below don't exist yet. On a brand-new server, obtain the first
# certificate with a one-off standalone certbot run (port 80, no nginx
# running yet) BEFORE the first `docker compose -f docker-compose.prod.yml
# up -d` — see docs/DEPLOYMENT.md's "Initial TLS bootstrap" step. Every
# renewal after that is handled by the `certbot` service in
# docker-compose.prod.yml without downtime, since nginx is already running
# and only needs a reload (not a restart) to pick up the renewed cert.

server {
    listen 80;
    server_name ${DOMAIN};

    # Let certbot's renewal container (webroot mode) answer ACME challenges
    # without touching the HTTPS redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Modest defaults for a small-VPS deployment (CLAUDE.md) — raise if a
    # tenant's bulk CSV import or logo uploads need more headroom.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
