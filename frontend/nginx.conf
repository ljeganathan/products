server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Modest default for a small-VPS deployment (CLAUDE.md) — raise if a
    # tenant's bulk CSV import or logo uploads need more headroom. Only
    # matters in the prod image; local dev bypasses this file entirely
    # (Vite dev server serves the frontend directly).
    client_max_body_size 10m;

    # In production this container is the sole public origin behind a
    # reverse proxy (nginx+certbot per docs/DEPLOYMENT.md, or an existing
    # Traefik instance per docs/DEPLOYMENT.md's "Deploying alongside an
    # existing Traefik" section) — it proxies the API itself rather than
    # needing a separate proxy tier in front of both frontend and backend.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
