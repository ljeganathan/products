# NOTE: GitHub Actions only reads workflows from the repo root, so this file is never
# actually executed — it's kept as a per-product reference copy. The workflow that
# really runs on push/PR is /.github/workflows/kotmate-tn-deploy.yml at the products
# monorepo root; keep both in sync when changing either (a font-install step went
# missing here from that one once already — don't repeat that).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kotmate
          POSTGRES_PASSWORD: kotmate
          POSTGRES_DB: kotmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kotmate -d kotmate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://kotmate:kotmate@localhost:5432/kotmate
      APP_DATABASE_URL: postgresql+asyncpg://kotmate_app:kotmate_app@localhost:5432/kotmate
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Seen repeatedly in 2026-11: this runner's default DNS resolver fails to
      # resolve archive.ubuntu.com/security.ubuntu.com/azure.archive.ubuntu.com on
      # *every* attempt, not intermittently — a known occasional GitHub-hosted-
      # runner issue, not an Ubuntu mirror outage (retrying the same broken
      # resolver wouldn't help on its own). Pointing at public DNS first fixes it.
      - name: Work around occasional runner DNS resolution issues
        run: |
          sudo resolvectl dns eth0 8.8.8.8 1.1.1.1 2>/dev/null || true
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null || true
      # Tamil item/category names are rasterized (KOT/bill printing, and report
      # printing's Tamil toggle — CLAUDE.md §10/§11) via a Tamil-glyph font at print
      # time, same packages backend/Dockerfile installs in the production image — the
      # runner needs them too or every Tamil-rasterization test fails with "No Tamil
      # font found on this system". Retried too, as a second line of defense (mirrors
      # .github/workflows/kotmate-tn-deploy.yml at the monorepo root).
      - run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig fonts-lohit-taml libraqm0
            if [ $? -eq 0 ]; then exit 0; fi
            echo "apt-get attempt $i failed — retrying in 20s..."
            sleep 20
          done
          echo "apt-get failed after 5 attempts."
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
