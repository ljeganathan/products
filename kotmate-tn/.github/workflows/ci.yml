# NOTE: this file only actually runs if kotmate-tn is checked out as its own
# top-level GitHub repo — GitHub Actions only reads workflows from a repo's
# root .github/workflows/. This code now lives inside github.com/ljeganathan/
# products as a kotmate-tn/ subfolder, where a nested .github/workflows/ci.yml
# here is invisible to Actions. These `backend`/`frontend` jobs are kept here
# as the authoritative reference for what CI should run; the actual,
# currently-triggering counterpart lives in the products monorepo at
# .github/workflows/kotmate-tn-ci.yml (path-filtered to kotmate-tn/**) — keep
# both in sync if either changes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kotmate
          POSTGRES_PASSWORD: kotmate
          POSTGRES_DB: kotmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kotmate -d kotmate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://kotmate:kotmate@localhost:5432/kotmate
      APP_DATABASE_URL: postgresql+asyncpg://kotmate_app:kotmate_app@localhost:5432/kotmate
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
