server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Modest default for a small-VPS deployment — raise if a tenant's bulk
    # CSV import or logo uploads need more headroom. Only matters in the prod
    # image; local dev bypasses this file entirely (Vite dev server serves
    # the frontend directly).
    client_max_body_size 10m;

    # In production this container is the sole origin behind the shared
    # Traefik instance (docs/DEPLOYMENT.md) — it proxies the API and the
    # KDS/POS websocket itself rather than needing a separate proxy tier in
    # front of both frontend and backend.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kitchen Display / POS live-update channel (CLAUDE.md §10/§11) — needs
    # the Upgrade/Connection headers and a long read timeout since it's a
    # long-lived connection, not a request/response call.
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
