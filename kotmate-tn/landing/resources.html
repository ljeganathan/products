<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demos &amp; Blog | KOTMate</title>
<meta name="description" content="Watch short demo videos of KOTMate's POS, KOT and billing screens in action, and read tips for running a faster restaurant counter." />
<link rel="canonical" href="https://kotmatetn.in/resources.html" />
<link rel="icon" href="assets/favicon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<style>
  .res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; margin-top: 32px; }
  .res-video { cursor: pointer; border: none; background: none; padding: 0; text-align: left; font: inherit; color: inherit; display: block; width: 100%; }
  .res-video__thumb { position: relative; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); aspect-ratio: 16/9; background: var(--surface-2); }
  .res-video__thumb img { width: 100%; height: 100%; object-fit: cover; }
  .res-video__play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .res-video__play span { width: 56px; height: 56px; border-radius: 50%; background: rgba(32,38,38,0.72); display: flex; align-items: center; justify-content: center; }
  .res-video__play svg { width: 22px; height: 22px; fill: #fff; margin-left: 3px; }
  .res-video h3 { margin: 12px 0 4px; font-size: 1.05rem; }
  .res-video p { font-size: 0.92rem; margin: 0; }
  .res-post { border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); background: var(--surface); display: flex; flex-direction: column; }
  .res-post__cover { aspect-ratio: 16/9; background: var(--surface-2); }
  .res-post__cover img { width: 100%; height: 100%; object-fit: cover; }
  .res-post__body { padding: 18px 20px 22px; }
  .res-post h3 { font-size: 1.1rem; margin-bottom: 6px; }
  .res-post__date { font-size: 0.82rem; color: var(--ink-faint); margin-bottom: 10px; }
  .res-empty { color: var(--ink-faint); padding: 24px 0; }
  .video-modal { position: fixed; inset: 0; background: rgba(20,24,24,0.82); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 200; }
  .video-modal[hidden] { display: none; }
  .video-modal__inner { width: 100%; max-width: 860px; }
  .video-modal__frame { position: relative; aspect-ratio: 16/9; border-radius: var(--radius-md); overflow: hidden; background: #000; }
  .video-modal__frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video-modal__close { display: block; margin: 0 0 10px auto; background: none; border: none; color: #fff; font-size: 0.9rem; cursor: pointer; padding: 6px; }
</style>
</head>
<body>

<header class="site-header is-scrolled">
  <div class="container site-header__inner">
    <a href="/" class="brand" aria-label="KOTMate home">
      <img src="assets/logo-full.png" alt="KOTMate TN — Hotel Billing &amp; POS System" width="168" height="32" />
    </a>
    <div class="header-actions">
      <a class="btn btn--secondary" href="/">Back to site</a>
      <a class="btn btn--primary" href="https://app.kotmatetn.in" data-track="login_click">Login</a>
    </div>
  </div>
</header>

<main class="section">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">Demos &amp; Blog</p>
      <h1>See KOTMate in action</h1>
      <p>Short demo videos of the POS, KOT and billing screens, plus tips for running a faster restaurant counter.</p>
    </div>

    <h2 style="margin-top:40px;font-size:1.3rem;">Demo videos</h2>
    <div id="videos-grid" class="res-grid">
      <p class="res-empty">Loading…</p>
    </div>

    <h2 style="margin-top:56px;font-size:1.3rem;">From the blog</h2>
    <div id="posts-grid" class="res-grid">
      <p class="res-empty">Loading…</p>
    </div>
  </div>
</main>

<div class="video-modal" id="video-modal" hidden>
  <div class="video-modal__inner">
    <button class="video-modal__close" id="video-modal-close" type="button">✕ Close</button>
    <div class="video-modal__frame"><iframe id="video-modal-iframe" title="Demo video" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
  </div>
</div>

<footer class="site-footer">
  <div class="container footer-bottom">
    <span>© <span id="year"></span> KOTMate TN. All rights reserved.</span>
    <span><a href="/">Home</a> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms &amp; Conditions</a></span>
  </div>
</footer>

<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
<script defer src="js/api-config.js"></script>
<script defer src="js/resources.js"></script>
<script defer>
  window.addEventListener("DOMContentLoaded", async () => {
    const { fetchJson, formatDate, toEmbedUrl, escapeHtml } = window.KOTMateResources;

    const videosGrid = document.getElementById("videos-grid");
    const modal = document.getElementById("video-modal");
    const modalFrame = document.getElementById("video-modal-iframe");
    document.getElementById("video-modal-close").addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
    function closeModal() {
      modal.hidden = true;
      modalFrame.src = "";
    }
    function openModal(url) {
      modalFrame.src = toEmbedUrl(url) + (toEmbedUrl(url).includes("?") ? "&" : "?") + "autoplay=1";
      modal.hidden = false;
    }

    try {
      const videos = await fetchJson("/api/v1/public/demo-videos");
      videosGrid.innerHTML = "";
      if (videos.length === 0) {
        videosGrid.innerHTML = '<p class="res-empty">No demo videos yet — check back soon.</p>';
      }
      for (const video of videos) {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "res-video";
        el.innerHTML = `
          <div class="res-video__thumb">
            ${video.thumbnail_url ? `<img src="${escapeHtml(video.thumbnail_url)}" alt="" loading="lazy" />` : ""}
            <div class="res-video__play"><span><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></div>
          </div>
          <h3>${escapeHtml(video.title)}</h3>
          ${video.description ? `<p>${escapeHtml(video.description)}</p>` : ""}
        `;
        el.addEventListener("click", () => openModal(video.video_url));
        videosGrid.appendChild(el);
      }
    } catch {
      videosGrid.innerHTML = '<p class="res-empty">Couldn\'t load videos right now — please try again later.</p>';
    }

    const postsGrid = document.getElementById("posts-grid");
    try {
      const posts = await fetchJson("/api/v1/public/blog-posts");
      postsGrid.innerHTML = "";
      if (posts.length === 0) {
        postsGrid.innerHTML = '<p class="res-empty">No posts yet — check back soon.</p>';
      }
      for (const post of posts) {
        const a = document.createElement("a");
        a.href = `blog-post.html?slug=${encodeURIComponent(post.slug)}`;
        a.className = "res-post";
        a.innerHTML = `
          ${post.cover_image_url ? `<div class="res-post__cover"><img src="${escapeHtml(post.cover_image_url)}" alt="" loading="lazy" /></div>` : ""}
          <div class="res-post__body">
            <h3>${escapeHtml(post.title)}</h3>
            <p class="res-post__date">${formatDate(post.published_at)}</p>
            ${post.excerpt ? `<p>${escapeHtml(post.excerpt)}</p>` : ""}
          </div>
        `;
        postsGrid.appendChild(a);
      }
    } catch {
      postsGrid.innerHTML = '<p class="res-empty">Couldn\'t load posts right now — please try again later.</p>';
    }
  });
</script>
</body>
</html>
