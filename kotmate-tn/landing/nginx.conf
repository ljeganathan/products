server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # This is a static marketing site only — it never talks to the KOTMate
    # API/app, so no /api, /uploads or /ws proxying here (compare
    # frontend/nginx.conf, which does need those). It never handles a login
    # or collects payment details itself either — every "Login"/"Start Free
    # Trial" control just links out to https://app.kotmatetn.in.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location ~* \.(?:png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    # Plain multi-page site (index/privacy/terms) — no client-side router, so
    # an unmatched path is a real 404, not rewritten to index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
