<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>KOTMate Locked</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; padding: 24px; background: #f5f6f7;
         display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 15px; margin: 0 0 16px; text-align: center; }
  input { width: 160px; box-sizing: border-box; padding: 10px; font-size: 20px;
          letter-spacing: 4px; text-align: center; border: 1px solid #ccc;
          border-radius: 4px; margin-bottom: 14px; }
  button { background: #1f7a55; color: white; border: none; border-radius: 4px;
           padding: 9px 22px; font-size: 13px; font-weight: 600; cursor: pointer; }
  #error { font-size: 12px; color: #b8312f; height: 16px; margin-top: 10px; }
</style>
</head>
<body>
  <h1>This device is locked.<br />Enter the PIN to continue.</h1>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" autofocus />
  <button onclick="submitPin()">Unlock</button>
  <div id="error"></div>

<script>
  async function submitPin() {
    const pin = document.getElementById('pin').value;
    const ok = await window.pywebview.api.check_pin(pin);
    if (!ok) {
      document.getElementById('error').textContent = 'Wrong PIN';
      document.getElementById('pin').value = '';
    }
  }
  document.getElementById('pin').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitPin();
  });
</script>
</body>
</html>
