services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kotmate
      POSTGRES_PASSWORD: kotmate
      POSTGRES_DB: kotmate
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotmate -d kotmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://kotmate:kotmate@postgres:5432/kotmate
      APP_DATABASE_URL: postgresql+asyncpg://kotmate_app:kotmate_app@postgres:5432/kotmate
      CORS_ORIGINS: '["http://localhost:5173", "http://192.168.0.125:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://192.168.0.125:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Production reverse-proxy stub (nginx serving the built frontend + proxying
  # /api to the backend). Not part of the default local-dev `docker compose up`
  # flow — bring it up explicitly once Phase 12 wires the real prod config:
  #   docker compose --profile prod up nginx
  nginx:
    profiles: ["prod"]
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
