# The workflow that actually runs on GitHub for KOTMate TN — lives at the products
# monorepo's root (required: Actions only reads .github/workflows/ from a repo's
# root) and is path-filtered to only trigger on changes under kotmate-tn/. Mirrors
# the jobs documented in kotmate-tn/.github/workflows/ci.yml (kept there as the
# per-product reference, from before it moved into this monorepo), adapted for the
# monorepo layout. No deploy job yet — KOTMate TN hasn't reached its deploy phase
# (CLAUDE.md §12 Phase 12), unlike StoreMate TN's workflow in this same directory.
name: KOTMate TN — CI

on:
  push:
    branches: [main]
    paths: ["kotmate-tn/**"]
  pull_request:
    paths: ["kotmate-tn/**"]

jobs:
  backend:
    name: Backend (lint, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kotmate
          POSTGRES_PASSWORD: kotmate
          POSTGRES_DB: kotmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kotmate -d kotmate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://kotmate:kotmate@localhost:5432/kotmate
      APP_DATABASE_URL: postgresql+asyncpg://kotmate_app:kotmate_app@localhost:5432/kotmate
    defaults:
      run:
        working-directory: kotmate-tn/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: kotmate-tn/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotmate-tn/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kotmate-tn/frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
