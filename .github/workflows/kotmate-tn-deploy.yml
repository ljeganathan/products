# The workflow that actually runs on GitHub for KOTMate TN — lives at the products
# monorepo's root (required: Actions only reads .github/workflows/ from a repo's
# root) and is path-filtered to only trigger on changes under kotmate-tn/. Mirrors
# the jobs documented in kotmate-tn/.github/workflows/ci.yml (kept there as the
# per-product reference) plus the deploy step, adapted for the monorepo layout —
# same shape as storemate-tn-deploy.yml in this same directory. Replaces the old
# kotmate-tn-ci.yml now that KOTMate TN has reached its deploy phase
# (kotmate-tn/docs/DEPLOYMENT.md).
name: KOTMate TN — CI & Deploy

on:
  push:
    branches: [main]
    paths: ["kotmate-tn/**"]
  pull_request:
    paths: ["kotmate-tn/**"]

jobs:
  backend:
    name: Backend (lint, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kotmate
          POSTGRES_PASSWORD: kotmate
          POSTGRES_DB: kotmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kotmate -d kotmate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://kotmate:kotmate@localhost:5432/kotmate
      APP_DATABASE_URL: postgresql+asyncpg://kotmate_app:kotmate_app@localhost:5432/kotmate
    defaults:
      run:
        working-directory: kotmate-tn/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: kotmate-tn/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotmate-tn/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kotmate-tn/frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to Hostinger VPS
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Gates this on manual approval via the "production" environment (already
    # configured on this repo for storemate-tn's own deploy job — required
    # reviewer applies here too, adding KOTMATE_* secrets to it doesn't touch
    # storemate-tn's STOREMATE_* secrets). See kotmate-tn/docs/DEPLOYMENT.md
    # §6 for the one-time secrets setup this needs before it can actually run.
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.KOTMATE_DEPLOY_HOST }}
          username: ${{ secrets.KOTMATE_DEPLOY_USER }}
          key: ${{ secrets.KOTMATE_DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.KOTMATE_DEPLOY_PATH }}
            bash scripts/deploy.sh
