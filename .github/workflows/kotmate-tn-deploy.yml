# The workflow that actually runs on GitHub for KOTMate TN — lives at the products
# monorepo's root (required: Actions only reads .github/workflows/ from a repo's
# root) and is path-filtered to only trigger on changes under kotmate-tn/. Mirrors
# the jobs documented in kotmate-tn/.github/workflows/ci.yml (kept there as the
# per-product reference) plus the deploy step, adapted for the monorepo layout —
# same shape as storemate-tn-deploy.yml in this same directory. Replaces the old
# kotmate-tn-ci.yml now that KOTMate TN has reached its deploy phase
# (kotmate-tn/docs/DEPLOYMENT.md).
#
# Narrowed from a blanket "kotmate-tn/**" (2026-11) — scripts/deploy.sh only ever
# rebuilds postgres/backend/nginx(frontend)/landing, so the native-shell add-ons
# (android-print-agent/, android-table-tablet/, android-staff-app/, desktop-app/,
# installer/ — none of them part of docker-compose at all) and docs/ were
# needlessly triggering this whole pipeline, including the flaky apt-get step,
# on every commit to those folders.
name: KOTMate TN — CI & Deploy

on:
  push:
    branches: [main]
    paths:
      - "kotmate-tn/backend/**"
      - "kotmate-tn/frontend/**"
      - "kotmate-tn/landing/**"
      - "kotmate-tn/docker-compose*.yml"
      - "kotmate-tn/scripts/**"
      - ".github/workflows/kotmate-tn-deploy.yml"
  pull_request:
    paths:
      - "kotmate-tn/backend/**"
      - "kotmate-tn/frontend/**"
      - "kotmate-tn/landing/**"
      - "kotmate-tn/docker-compose*.yml"
      - "kotmate-tn/scripts/**"
      - ".github/workflows/kotmate-tn-deploy.yml"

jobs:
  backend:
    name: Backend (lint, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kotmate
          POSTGRES_PASSWORD: kotmate
          POSTGRES_DB: kotmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kotmate -d kotmate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://kotmate:kotmate@localhost:5432/kotmate
      APP_DATABASE_URL: postgresql+asyncpg://kotmate_app:kotmate_app@localhost:5432/kotmate
    defaults:
      run:
        working-directory: kotmate-tn/backend
    steps:
      - uses: actions/checkout@v4
      # Seen repeatedly in 2026-11: this runner's default DNS resolver fails to
      # resolve archive.ubuntu.com/security.ubuntu.com/azure.archive.ubuntu.com on
      # *every* attempt, not intermittently — a known occasional GitHub-hosted-
      # runner issue, not an Ubuntu mirror outage (retrying the same broken
      # resolver wouldn't help on its own). Pointing at public DNS first fixes it.
      - name: Work around occasional runner DNS resolution issues
        run: |
          sudo resolvectl dns eth0 8.8.8.8 1.1.1.1 2>/dev/null || true
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null || true
      # Tamil item/category names are rasterized (KOT/bill printing, and report
      # printing's Tamil toggle) via a Tamil-glyph font at print time, same packages
      # kotmate-tn/backend/Dockerfile installs in the production image — the runner
      # needs them too or every Tamil-rasterization test fails with "No Tamil font
      # found on this system" (mirrors kotmate-tn/.github/workflows/ci.yml). Retried
      # too, as a second line of defense in case the DNS fix above isn't enough.
      - run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig fonts-lohit-taml libraqm0 libzbar0
            if [ $? -eq 0 ]; then exit 0; fi
            echo "apt-get attempt $i failed — retrying in 20s..."
            sleep 20
          done
          echo "apt-get failed after 5 attempts."
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: kotmate-tn/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotmate-tn/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kotmate-tn/frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to Hostinger VPS
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Gates this on manual approval via the "production" environment (already
    # configured on this repo for storemate-tn's own deploy job — required
    # reviewer applies here too, adding KOTMATE_* secrets to it doesn't touch
    # storemate-tn's STOREMATE_* secrets). See kotmate-tn/docs/DEPLOYMENT.md
    # §6 for the one-time secrets setup this needs before it can actually run.
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.KOTMATE_DEPLOY_HOST }}
          username: ${{ secrets.KOTMATE_DEPLOY_USER }}
          key: ${{ secrets.KOTMATE_DEPLOY_SSH_KEY }}
          # Default command_timeout is 10m — too short for the rare occasion the
          # backend's base image gets a Debian update upstream, which busts the
          # whole Docker layer cache and forces a full apt-get/pip reinstall during
          # the build (seen 2026-10-14 and again 2026-10-27, the latter also hitting
          # an unusually slow deb.debian.org mirror from the VPS — a single rebuild
          # took over an hour). The Dockerfile now pins FROM to python:3.11-slim-
          # bookworm so this shouldn't recur, but 60m stays as a safety net in case
          # the mirror itself is just slow on a given day.
          command_timeout: 60m
          script: |
            cd ${{ secrets.KOTMATE_DEPLOY_PATH }}
            bash scripts/deploy.sh
